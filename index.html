<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,300&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <section class="card head">
        <div class="brand">
          <div class="head-day" data-i18n="appName">Account</div>
          <div class="head-date" id="brandSub"></div>
        </div>
        <div class="head-tools">
          <div class="lang" id="lang" role="group" aria-label="Language" hidden>
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="uk">UA</button>
          </div>
        <button class="bell cloud" id="cloud" type="button" data-state="off" aria-label="Account" title="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5a4.5 4.5 0 0 1-.6-8.96 6 6 0 0 1 11.5 1.5A3.75 3.75 0 0 1 17.25 18.5H7Z"/></svg>
        </button>
        <button class="bell" id="bell" type="button" aria-label="Event notifications" title="Event notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9Z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
        </button>
        </div>
      </section>

      <section class="card mini">
        <div class="mini-top">
          <button type="button" id="miniPrev" aria-label="Previous month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
          <h2 id="miniTitle"></h2>
          <button type="button" id="miniNext" aria-label="Next month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
        <div class="mini-grid" id="miniGrid"></div>
      </section>

      <section class="card timer">
        <div class="timer-top">
          <h2 data-i18n="projects">Projects</h2>
          <span class="timer-hint" id="dialHalf">Total 0:00</span>
        </div>
        <div class="dial">
          <svg id="dialSvg" viewBox="0 0 300 300" aria-hidden="true"></svg>
          <button class="dial-btn" id="dialBtn" type="button">
            <span class="dial-cat" id="dialCat"></span>
            <span class="dial-time" id="dialTime">0:00</span>
            <span class="dial-state" id="dialState">START</span>
          </button>
        </div>
      </section>

      <div class="foot">
        <button type="button" class="card plan-card" id="planCard">
          <span class="head-day"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M4 12h7M4 18h5"/><path d="m14 16 3 3 5-6"/></svg><span data-i18n="planner">Planner</span></span>
          <span class="head-date" id="planSub"></span>
        </button>
        <section class="card clock" id="clock" aria-label="Kyiv time">00:00:00</section>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <h1 id="title"></h1>
        <div class="seg" id="seg" role="tablist">
          <button type="button" data-view="month" data-i18n="month">Month</button>
          <button type="button" data-view="week" data-i18n="week">Week</button>
          <button type="button" data-view="day" data-i18n="day">Day</button>
        </div>
        <div class="nav">
          <button type="button" id="prev" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
          <button type="button" id="today" class="today"><span class="lbl-today" data-i18n="today">Today</span><span class="lbl-date" id="navDate"></span></button>
          <button type="button" id="next" aria-label="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
      </header>

      <div class="strip" id="strip"></div>
      <div class="body" id="body"></div>
    </main>
  </div>

  <form class="pop" id="pop" hidden autocomplete="off">
    <div class="pop-head">
      <button type="button" class="swatch" id="fColor" aria-label="Project color" title="Project color"></button>
      <input class="pop-title" id="fTitle" type="text" data-i18n-ph="titlePh" placeholder="Project name" maxlength="80" required>
    </div>
    <div class="colors" id="fColors" hidden></div>
    <label class="row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <input id="fDate" type="date">
      <span class="daily" id="fDaily" data-i18n="everyDay" hidden>Every day</span>
    </label>
    <div class="row row-top">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <div class="slots">
        <div id="fSlots"></div>
        <button type="button" class="add-slot" id="fAddSlot">+ <span data-i18n="addTime">Add time</span></button>
      </div>
    </div>
    <label class="row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 7.4 4.3" stroke-width="3.2"/></svg>
      <span class="check">
        <input id="fDial" type="checkbox">
        <span data-i18n="addToDial">Add to circle</span>
      </span>
    </label>
    <div class="pop-actions">
      <button type="submit" id="fSave">Add Event</button>
      <button type="button" id="fDup" aria-label="Duplicate" title="Duplicate" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 8.5V6.5A2.5 2.5 0 0 0 13 4H6.5A2.5 2.5 0 0 0 4 6.5V13a2.5 2.5 0 0 0 2.5 2.5h2"/></svg></button>
      <button type="button" id="fAlt" aria-label="Cancel"></button>
    </div>
  </form>

  <dialog class="planner" id="planDlg">
    <div class="plan-head">
      <div>
        <h3 data-i18n="planner">Planner</h3>
        <p class="sync-help" data-i18n="planHelp"></p>
      </div>
      <button type="button" class="plan-x" id="planClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="plan-body">
      <section class="plan-sec">
        <h4 data-i18n="planWork">Working time</h4>
        <div class="plan-days" id="planDays"></div>
        <div class="plan-opts">
          <label><span data-i18n="planFrom">From</span><select id="planFrom"></select></label>
          <label><span data-i18n="planTo">To</span><select id="planTo"></select></label>
          <label><span data-i18n="planBlock">Focus block</span><select id="planBlock"></select></label>
          <label><span data-i18n="planGap">Break</span><select id="planGap"></select></label>
        </div>
        <div class="plan-lunch">
          <button type="button" class="plan-toggle" id="planLunch" aria-pressed="false"><i></i><span data-i18n="planLunch">Lunch break</span></button>
          <select id="planLunchFrom" aria-label="Lunch from"></select>
          <select id="planLunchTo" aria-label="Lunch to"></select>
        </div>
      </section>
      <section class="plan-sec">
        <h4 data-i18n="planProjectsTitle">Projects</h4>
        <div id="planTasks"></div>
        <button type="button" class="add-slot" id="planAdd">+ <span data-i18n="planAddTask">Add project</span></button>
      </section>
    </div>
    <div class="plan-foot">
      <p class="plan-sum" id="planSum"></p>
      <div class="sync-actions">
        <button type="button" id="planClear" data-i18n="planClear">Clear plan</button>
        <button type="button" class="primary" id="planRun" data-i18n="planRun">Plan</button>
      </div>
    </div>
  </dialog>

  <dialog class="sync" id="syncDlg">
    <form id="syncForm" method="dialog">
      <h3 data-i18n="accTitle">Account</h3>
      <p class="sync-help" id="accHelp"></p>
      <p class="sync-status" id="syncStatus" role="status"></p>
      <div class="sync-actions">
        <button type="button" id="accOut" data-i18n="accOut" hidden>Sign out</button>
        <button type="button" id="syncClose" data-i18n="close">Close</button>
        <button type="button" class="primary" id="accIn" data-i18n="accIn">Sign in with Google</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
