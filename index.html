<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Designer Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,300&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0b0b0f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-clarity-mask="true" data-tab="cal">
  <div class="app">
    <aside class="side">
      <section class="card head">
        <svg class="logo" width="34" height="34" viewBox="0 0 52 52" fill="currentColor" aria-hidden="true"><path d="M42.6106 4.95669L52 4.0582L43.5574 7.57728L42.6106 4.95669Z"/><path d="M32.701 11.4952L41.1367 11.3702L43.2299 7.93246L42.1701 5.00854L33.7988 2.16074L27.0132 8.3004L32.701 11.4952Z"/><path d="M40.84 11.7878L32.5757 11.9198L29.3228 26.686L40.84 11.7878Z"/><path d="M31.3712 11.2306L18.0796 7.45425L11.7776 0.171875L31.3712 11.2306Z"/><path d="M0 2.80066L12.5461 22.5594L31.99 11.8418L0 2.80066Z"/><path d="M28.8079 27.0192L32.0671 12.2821L12.7881 22.9081L28.8079 27.0192Z"/><path d="M12.5541 23.283L28.3869 27.3376L7.77279 38.2097L12.5541 23.283Z"/><path d="M7.72232 38.7074L16.3937 34.1093L6.55639 52L7.72232 38.7074Z"/></svg>
        <div class="brand">
          <div class="head-day" data-i18n="appName">Account</div>
          <div class="head-date" id="brandSub"></div>
        </div>
        <div class="head-tools">
        <button class="menu-btn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="accMenu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        </div>
        <div class="acc-menu" id="accMenu" hidden>
          <div class="mi-status" id="cloud" data-state="off"><i></i><span id="menuStatus"></span></div>
          <button class="mi" id="bell" type="button">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9Z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
            <span data-i18n="menuNotif">Notifications</span><em id="bellState"></em>
          </button>
          <button class="mi" id="mAccess" type="button" hidden>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="8" r="3.6"/><path d="M3 19.5c.6-3.4 3.2-5.2 6.5-5.2s5.9 1.800 6.5 5.2"/><path d="M19 7.500v6M16 10.500h6"/></svg>
            <span data-i18n="menuAccess">Add a person</span><em id="accessCount"></em>
          </button>
          <div class="people" id="menuPeople" hidden></div>
          <button class="mi" id="mLink" type="button" hidden>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.500 4.500 0 0 0 6.400 0l3-3a4.500 4.500 0 0 0-6.400-6.400l-1 1"/><path d="M14 10a4.500 4.500 0 0 0-6.400 0l-3 3a4.500 4.500 0 0 0 6.400 6.400l1-1"/></svg>
            <span data-i18n="accCopy">Copy link</span>
          </button>
          <button class="mi" id="mMine" type="button" hidden>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
            <span data-i18n="menuMine">My calendar</span>
          </button>
          <div class="mi-row">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.500 12h17M12 3.500c2.300 2.400 3.500 5.200 3.500 8.500s-1.200 6.100-3.500 8.500c-2.300-2.400-3.500-5.200-3.500-8.500s1.200-6.100 3.500-8.500Z"/></svg>
            <span data-i18n="menuLang">Language</span>
            <div class="lang" id="lang" role="group">
              <button type="button" data-lang="en">EN</button>
              <button type="button" data-lang="uk">UA</button>
              <button type="button" data-lang="ru">RU</button>
            </div>
          </div>
          <button class="mi" id="mIn" type="button" hidden>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h3.500A2.500 2.500 0 0 1 20 6.500v11a2.500 2.500 0 0 1-2.500 2.500H14"/><path d="M4 12h11M11 8l4 4-4 4"/></svg>
            <span data-i18n="accIn">Sign in with Google</span>
          </button>
          <button class="mi out" id="mOut" type="button" hidden>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6.500A2.500 2.500 0 0 0 4 6.500v11A2.500 2.500 0 0 0 6.500 20H10"/><path d="M9 12h11M16 8l4 4-4 4"/></svg>
            <span data-i18n="accOut">Sign out</span>
          </button>
        </div>
      </section>

      <section class="card mini">
        <div class="mini-top">
          <button type="button" id="miniPrev" aria-label="Previous month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
          <h2 id="miniTitle"></h2>
          <button type="button" id="miniNext" aria-label="Next month"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
        <div class="mini-grid" id="miniGrid"></div>
      </section>

      <section class="card timer">
        <div class="timer-top">
          <h2 id="dialTitle">Today's tasks</h2>
          <span class="timer-hint" id="dialHalf">Hours 0:00</span>
        </div>
        <div class="dial">
          <svg id="dialSvg" viewBox="0 0 300 300" aria-hidden="true"></svg>
          <button class="dial-btn" id="dialBtn" type="button">
            <span class="dial-time" id="dialTime">0:00</span>
            <span class="dial-state" id="dialState"></span>
          </button>
        </div>
      </section>

      <div class="foot">
        <button type="button" class="card plan-card" id="planCard">
          <span class="plan-ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 12h7M4 18h5"/><path d="m13.5 16 3 3 5.5-7"/></svg></span>
          <span class="plan-txt">
            <span class="head-day" data-i18n="planner">Planner</span>
            <span class="head-date" id="planSub"></span>
          </span>
        </button>
        <section class="card clock" id="clock" aria-label="Local time">00:00:00</section>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <h1 id="title"></h1>
        <div class="seg" id="seg" role="tablist">
          <button type="button" data-view="month" data-i18n="month">Month</button>
          <button type="button" data-view="week" data-i18n="week">Week</button>
          <button type="button" data-view="day" data-i18n="day">Day</button>
        </div>
        <div class="nav">
          <button type="button" id="prev" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
          <button type="button" id="today" class="today"><span class="lbl-today" data-i18n="today">Today</span><span class="lbl-date" id="navDate"></span></button>
          <button type="button" id="next" aria-label="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
      </header>

      <div class="strip" id="strip"></div>
      <div class="body" id="body"></div>
    </main>

    <nav class="tabbar" id="tabbar">
      <button type="button" class="on" data-tab="cal" aria-pressed="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span data-i18n="tabCal">Calendar</span>
      </button>
      <button type="button" data-tab="day" aria-pressed="false">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 1.5M9.500 3h5"/></svg>
        <span data-i18n="tabTimer">Timer</span>
      </button>
      <button type="button" id="tabPlan">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h11M4 12h7M4 18h5"/><path d="m13.500 16 3 3 5.500-7"/></svg>
        <span data-i18n="planner">Planner</span>
      </button>
    </nav>
  </div>

  <form class="pop" id="pop" hidden autocomplete="off">
    <div class="pop-head">
      <button type="button" class="swatch" id="fColor" aria-label="Project color" title="Project color"></button>
      <input class="pop-title" id="fTitle" type="text" data-i18n-ph="titlePh" placeholder="Project name" maxlength="80" required>
    </div>
    <div class="colors" id="fColors" hidden></div>
    <label class="row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <input id="fDate" type="date">
      <span class="daily" id="fDaily" data-i18n="everyDay" hidden>Every day</span>
    </label>
    <div class="row row-top">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <div class="slots">
        <div id="fSlots"></div>
        <button type="button" class="add-slot" id="fAddSlot">+ <span data-i18n="addTime">Add time</span></button>
      </div>
    </div>
    <label class="row">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 7.4 4.3" stroke-width="3.2"/></svg>
      <span class="check">
        <input id="fDial" type="checkbox">
        <span data-i18n="addToDial">Task done</span>
      </span>
    </label>
    <div class="pop-actions">
      <button type="submit" id="fSave">Add Event</button>
      <button type="button" id="fDup" aria-label="Duplicate" title="Duplicate" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 8.5V6.5A2.5 2.5 0 0 0 13 4H6.5A2.5 2.5 0 0 0 4 6.5V13a2.5 2.5 0 0 0 2.5 2.5h2"/></svg></button>
      <button type="button" id="fAlt" aria-label="Cancel"></button>
    </div>
  </form>

  <dialog class="planner" id="planDlg" data-tab="projects">
    <div class="plan-head">
      <h3 data-i18n="planner">Planner</h3>
      <button type="button" class="plan-x" id="planClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="plan-tabs" id="planTabs" role="tablist">
      <button type="button" role="tab" data-tab="projects" data-i18n="planProjectsTitle">Projects</button>
      <button type="button" role="tab" data-tab="schedule" data-i18n="planSchedule">Working hours</button>
      <button type="button" role="tab" data-tab="stats" data-i18n="planStats">Statistics</button>
    </div>
    <button type="button" class="plan-add" id="planAdd"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="planAddTask">Add project</span></button>
    <div class="plan-body">
      <section class="plan-pane" data-pane="stats" id="planStats"></section>
      <section class="plan-pane" data-pane="projects">
        <div id="planTasks"></div>
      </section>
      <section class="plan-pane" data-pane="schedule">
        <div class="plan-sec">
          <div class="week-head">
            <h4 id="planWeekLabel"></h4>
            <div class="week-nav">
              <button type="button" id="planWeekPrev" aria-label="Previous week"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
              <button type="button" id="planWeekNext" aria-label="Next week"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
            </div>
          </div>
          <div id="planWeek"></div>
        </div>
        <div class="plan-sec">
          <h4 data-i18n="planBreaks">Focus and breaks</h4>
          <div class="plan-opts two">
            <label><span data-i18n="planBlock">Focus block</span><select id="planBlock"></select></label>
            <label><span data-i18n="planGap">Break</span><select id="planGap"></select></label>
          </div>
          <div class="plan-lunch">
            <button type="button" class="plan-toggle" id="planLunch" aria-pressed="false"><i></i><span data-i18n="planLunch">Lunch break</span></button>
            <select id="planLunchFrom" aria-label="Lunch from"></select>
            <select id="planLunchTo" aria-label="Lunch to"></select>
          </div>
        </div>
      </section>
    </div>
    <div class="plan-foot">
      <button type="button" class="primary" id="planRun" data-i18n="planRun">Save</button>
      <button type="button" id="planClear" data-i18n="planClear">Clear plan</button>
    </div>
  </dialog>

  <dialog class="sync ntf" id="ntfDlg">
    <div class="ntf-body">
      <div class="ntf-head">
        <h3 data-i18n="ntfTitle">Notifications and sounds</h3>
        <button type="button" class="plan-x" id="ntfClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="ntf-sec">
        <button type="button" class="plan-toggle" id="ntfSys" aria-pressed="false"><i></i><span data-i18n="ntfSys">System notifications</span></button>
        <p class="sync-help" data-i18n="ntfSysHelp"></p>
        <button type="button" class="plan-toggle" id="ntfSticky" aria-pressed="false"><i></i><span data-i18n="ntfSticky">Keep on screen until I click</span></button>
        <label class="ntf-line"><span data-i18n="ntfLead">Remind before a block</span><select id="ntfLead"></select></label>
        <label class="ntf-line"><span data-i18n="ntfVol">Volume</span><input id="ntfVol" type="range" min="0" max="100" step="5"></label>
      </div>
      <div class="ntf-sec">
        <h4 data-i18n="ntfEvents">What to notify about</h4>
        <div id="ntfEvents"></div>
      </div>
      <div class="ntf-sec" id="ntfInstallBox" hidden>
        <p class="sync-help" data-i18n="ntfInstallHelp"></p>
        <button type="button" class="ntf-install" id="ntfInstall" data-i18n="ntfInstall">Install as an app</button>
      </div>
    </div>
  </dialog>

  <dialog class="sync" id="syncDlg">
    <form id="syncForm" method="dialog">
      <h3 data-i18n="accTitle">Account</h3>
      <p class="sync-help" id="accHelp"></p>
      <p class="sync-status" id="syncStatus" role="status"></p>
      <div class="access" id="access" hidden>
        <h4 data-i18n="accShare">View access</h4>
        <p class="sync-help" data-i18n="accShareHelp"></p>
        <div class="acc-line">
          <input id="accMail" type="email" data-i18n-ph="accMailPh" placeholder="name@gmail.com" autocomplete="off" aria-label="Google email">
          <button type="button" id="accAdd" data-i18n="accAdd">Add</button>
        </div>
        <div id="accList"></div>
        <div class="acc-line">
          <input id="accLink" type="text" readonly aria-label="Link">
          <button type="button" id="accCopy" data-i18n="accCopy">Copy link</button>
        </div>
        <p class="sync-status" id="accMsg" role="status"></p>
      </div>
      <div class="sync-actions">
        <button type="button" id="accOut" data-i18n="accOut" hidden>Sign out</button>
        <button type="button" id="syncClose" data-i18n="close">Close</button>
        <button type="button" class="primary" id="accIn" data-i18n="accIn">Sign in with Google</button>
      </div>
    </form>
  </dialog>

  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h2 id="gateTitle"></h2>
      <p id="gateText" role="status"></p>
      <button type="button" class="gate-main" id="gateIn" hidden></button>
      <button type="button" id="gateOut" hidden></button>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
